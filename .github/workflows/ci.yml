name: CI

on:
  push:
    # Feature branches too: `deno check` is the only gate that catches a
    # type error in an Edge Function, and waiting for a PR meant the
    # branch could be deployed to production unverified.
    branches: [master, main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test --silent
      - run: npm run build
      # Dependency vulnerability scan — warn-only at this phase, switch to
      # blocking after the next pass. `--omit=dev` because dev-only deps
      # don't ship to production and would otherwise noise the signal.
      - name: npm audit (warn-only)
        run: npm audit --audit-level=high --omit=dev || true

  supabase-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # supabase/setup-cli doesn't install deno; we need it for the
      # Edge Function syntax check below. Pin a recent stable version.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # `supabase lint` was dropped — the top-level `lint` command isn't
      # available in the supabase CLI version installed by setup-cli@v1
      # (it became `supabase db lint`, which requires a linked project +
      # running DB). The meaningful SQL gate runs at deploy time via
      # `supabase db push` (which rejects malformed migrations). The Edge
      # Function syntax check below is the real CI gate.
      #
      # `deno check` must fail the build. A syntax error in any Edge
      # Function used to silently slip through because of `|| true`.
      - name: Validate Edge Function bundles
        run: |
          set -e
          for fn in supabase/functions/*/; do
            if [ -f "$fn/index.ts" ]; then
              echo "Checking $fn"
              deno check --no-lock "$fn/index.ts"
            fi
          done

      # config.toml's own rule: every function directory MUST be registered,
      # or it silently defaults to verify_jwt=true on the next clean deploy
      # and a webhook/worker caller with a non-JWT secret starts getting 401.
      - name: Every Edge Function is registered in config.toml
        run: |
          set -e
          missing=0
          for fn in supabase/functions/*/; do
            name=$(basename "$fn")
            [ -f "$fn/index.ts" ] || continue
            if ! grep -q "^\[functions\.${name}\]" supabase/config.toml; then
              echo "::error file=supabase/config.toml::missing [functions.${name}] entry"
              missing=1
            fi
          done
          for name in $(grep -o '^\[functions\.[^]]*\]' supabase/config.toml | sed 's/\[functions\.\(.*\)\]/\1/'); do
            if [ ! -f "supabase/functions/${name}/index.ts" ]; then
              echo "::error file=supabase/config.toml::[functions.${name}] has no directory"
              missing=1
            fi
          done
          [ "$missing" = 0 ]

  # Applies every migration to a real Postgres and creates a lead the way
  # the intakes do. Without it, a trigger that raises on every insert
  # (migration 128) passed CI and deploy, and no new lead could be saved
  # in production for two weeks. See scripts/db-smoke.sh.
  db-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the runner's PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "alter user postgres password 'postgres'"
      - name: Apply migrations and exercise the lead path
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          export PG_EXTENSION_DIR="$(ls -d /usr/share/postgresql/*/extension | sort -V | tail -1)"
          scripts/db-smoke.sh
