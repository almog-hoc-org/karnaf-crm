# Auto-deploy to Supabase after CI passes on master.
#
# Replaces the manual "run supabase db push + functions deploy from a
# laptop with the token" ritual: GitHub's runners have open network and
# the token lives in an Actions secret, so master merges deploy
# themselves. Migrations are applied through the Management API (token
# only — no database password needed), matching how prod migrations
# 085-092 were applied.
#
# Gated on CI (same pattern as vercel-production.yml): this used to run
# on the push itself, in parallel with CI, so a migration that failed
# db-smoke or an Edge Function that failed `deno check` was already in
# production by the time CI went red — the migration-128 incident exactly.
# Now it runs only when the CI run for a master commit succeeded, and it
# checks out that tested commit.
#
# One-time setup: add the SUPABASE_TOKEN secret at
#   Settings → Secrets and variables → Actions → New repository secret.
# (The Supabase CLI reads it via the SUPABASE_ACCESS_TOKEN env var below.)
#
# Manual re-run: Actions tab → "Deploy Supabase" → Run workflow.

name: Deploy Supabase

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

env:
  PROJECT_REF: svkzkpgccahwmyflobvn

permissions:
  contents: read

jobs:
  deploy:
    # workflow_dispatch has no workflow_run payload; a dispatch always runs.
    # For workflow_run: only a CI run that (1) succeeded, (2) was triggered
    # by a PUSH (a pull_request run from a fork whose branch happens to be
    # called "master" also reports head_branch == 'master'), (3) came from
    # this repository, and (4) tested the commit that is master's tip right
    # now (github.sha) — so a slow CI run for an older commit never
    # redeploys older code over a newer deploy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Guard — secret must exist
        run: |
          if [ -z "${{ secrets.SUPABASE_TOKEN }}" ]; then
            echo "::error::SUPABASE_TOKEN secret is not configured (Settings → Secrets → Actions)."
            exit 1
          fi

      # Apply any migration files whose numeric version is not yet in
      # supabase_migrations.schema_migrations, in order, via the
      # Management API query endpoint. Each applied migration is
      # recorded so re-runs are no-ops.
      - name: Apply pending migrations (Management API)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re, sys, time, urllib.error, urllib.request

          ref = os.environ['PROJECT_REF']
          # Tolerate common paste mistakes in the secret: surrounding
          # whitespace/newlines, wrapping quotes, or a KEY=value prefix.
          tok = os.environ['SUPABASE_ACCESS_TOKEN'].strip().strip('"\'')
          if '=' in tok and not tok.startswith('sbp_'):
              tok = tok.split('=', 1)[1].strip().strip('"\'')
          print(f'token check: {len(tok)} chars, sbp_ prefix: {tok.startswith("sbp_")}')

          # Raised for errors worth retrying (5xx, Supabase's 544, network
          # drops) so the caller can back off instead of aborting the deploy.
          class TransientApiError(Exception):
              pass


          def call(method, path, body=None, fatal=True):
              req = urllib.request.Request(
                  f'https://api.supabase.com{path}',
                  data=json.dumps(body).encode() if body is not None else None,
                  method=method,
                  # Cloudflare fronts api.supabase.com and blocks the default
                  # Python-urllib signature with error 1010 — a real UA is
                  # required, not optional.
                  headers={'Authorization': f'Bearer {tok}',
                           'Content-Type': 'application/json',
                           'User-Agent': 'curl/8.5.0'})
              try:
                  with urllib.request.urlopen(req, timeout=180) as r:
                      return json.loads(r.read().decode() or 'null')
              except urllib.error.URLError as e:
                  if not isinstance(e, urllib.error.HTTPError):
                      if not fatal:
                          raise TransientApiError(str(e))
                      print(f'::error::Supabase API network error on {method} {path}: {e}')
                      sys.exit(1)
                  detail = e.read().decode(errors='replace')[:300]
                  # 5xx (and Supabase's non-standard 544) mean "try again",
                  # not "the request was wrong".
                  if not fatal and e.code >= 500:
                      raise TransientApiError(f'{e.code}: {detail}')
                  print(f'::error::Supabase API {e.code} on {method} {path}: {detail}')
                  if e.code in (401, 403):
                      print('::error::The token was rejected. Regenerate at '
                            'https://supabase.com/dashboard/account/tokens and update '
                            'the SUPABASE_TOKEN repository secret (paste the raw '
                            'sbp_... value only).')
                  sys.exit(1)

          # Preflight — verifies the token and project access before any SQL.
          projects = call('GET', '/v1/projects') or []
          if not any(p.get('id') == ref for p in projects):
              orgs = call('GET', '/v1/organizations') or []
              print(f'::error::Token is valid but has no access to project {ref}.')
              print('::error::The token belongs to a Supabase account that is NOT '
                    'a member of the organization owning the production project. '
                    'It sees these organizations/projects instead:')
              for o in orgs:
                  print(f"::error::  org: {o.get('name')} ({o.get('id')})")
              for p in projects:
                  print(f"::error::  project: {p.get('name')} ({p.get('id')}, org {p.get('organization_id')})")
              sys.exit(1)
          print(f'preflight ok: token sees project {ref}')

          def q(sql, attempts=5):
              # The Management API's SQL endpoint returns 544 "Connection
              # terminated due to connection timeout" when the project's
              # pooler is saturated — which production is doing right now,
              # intermittently, for minutes at a time. Without a retry a
              # single bad moment aborts the deploy midway through the
              # migration list, which is a far worse state than waiting.
              # Every migration in this repo is written to be idempotent
              # (create ... if not exists / create or replace / guarded
              # cron.schedule), so a retried statement is safe.
              last = None
              for i in range(attempts):
                  try:
                      return call('POST', f'/v1/projects/{ref}/database/query',
                                  {'query': sql}, fatal=False)
                  except TransientApiError as e:
                      last = e
                      wait = 10 * (i + 1)
                      print(f'  transient API error ({e}); retry {i + 1}/{attempts} in {wait}s')
                      time.sleep(wait)
              print(f'::error::Supabase API kept failing after {attempts} attempts: {last}')
              sys.exit(1)

          applied = {row['version'] for row in
                     (q('select version from supabase_migrations.schema_migrations') or [])}
          print(f'{len(applied)} migrations already applied')

          files = sorted(f for f in os.listdir('supabase/migrations') if f.endswith('.sql'))
          pending = []
          for f in files:
              m = re.match(r'^(\d+)_', f)
              if m and m.group(1) not in applied:
                  pending.append((m.group(1), f))

          if not pending:
              print('No pending migrations.')
              sys.exit(0)

          for version, fname in pending:
              print(f'Applying {fname} ...')
              sql = open(f'supabase/migrations/{fname}').read()
              name = fname[:-4].split('_', 1)[1]
              q(sql)
              q("insert into supabase_migrations.schema_migrations(version, name) "
                f"values ('{version}', '{name}') on conflict do nothing")
              print(f'Applied {fname}')
          PYEOF

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Deploy every function; supabase/config.toml is the single source
      # of truth for verify_jwt, so a full deploy also heals any drift
      # from past ad-hoc --no-verify-jwt deployments.
      - name: Deploy all edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
        run: supabase functions deploy --project-ref "$PROJECT_REF"

      # `functions deploy` only adds and updates — a function deleted from
      # the repo stays deployed (and callable) in the project. Removals are
      # explicit and listed here, never inferred from the directory listing,
      # so nothing created outside the repo can be deleted by accident.
      # Idempotent: deleting an already-absent function is not an error.
      - name: Remove retired edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
          RETIRED_FUNCTIONS: internal-send-reply ai-review
        run: |
          for fn in $RETIRED_FUNCTIONS; do
            if [ -d "supabase/functions/$fn" ]; then
              echo "::error::$fn is listed as retired but still exists in the repo"; exit 1
            fi
            if supabase functions delete "$fn" --project-ref "$PROJECT_REF" 2>/tmp/del.err; then
              echo "deleted $fn"
            else
              grep -qiE "not found|does not exist|404" /tmp/del.err && echo "$fn already absent" || { cat /tmp/del.err; exit 1; }
            fi
          done
