# TEMPORARY read-only diagnostic — after_webinar incident, round 2:
# WABA config value, template sync history, and whether any customer
# actually received the broadcast. Remove after the incident.
name: Ops - Skipped Leads

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: after_webinar incident round 2
        env:
          SUPABASE_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
          PROJECT_REF: svkzkpgccahwmyflobvn
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request

          token = os.environ['SUPABASE_TOKEN']
          ref = os.environ['PROJECT_REF']

          def q(label, sql):
              req = urllib.request.Request(
                  f'https://api.supabase.com/v1/projects/{ref}/database/query',
                  data=json.dumps({'query': sql}).encode(),
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Content-Type': 'application/json',
                      'User-Agent': 'karnaf-ops/1.0',
                  }, method='POST')
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      rows = json.loads(r.read().decode())
              except Exception as e:
                  print(f'== {label} ==\nERROR: {e}\n')
                  return
              print(f'== {label} ==')
              print(json.dumps(rows, ensure_ascii=False, indent=1, default=str))
              print()

          q('whatsapp_waba_id config', """
              select config_key, config_value, updated_at
              from crm_config where config_key = 'whatsapp_waba_id'""")
          q('whatsapp templates - meta sync state', """
              select key, status,
                     metadata->'meta'->>'status' as meta_status,
                     metadata->'meta'->>'language' as meta_lang,
                     metadata->'meta'->>'synced_at' as synced_at
              from message_templates where channel = 'whatsapp'
              order by key""")
          q('meta-template-status responses last 7 days', """
              select status_code, left(content, 200) as content, created
              from net._http_response
              where content like '%stage%'
              order by created desc limit 10""")
          q('messages actually created for failed broadcast', """
              select count(*)
              from messages
              where raw_payload->>'broadcast_id' in (
                select id::text from broadcasts where template_key = 'after_webinar')""")
          q('after_webinar dispatch status counts', """
              select status, count(*)
              from outbound_dispatch
              where payload->'meta_template'->>'name' = 'after_webinar'
              group by 1""")
          q('after_webinar broadcast recipient status counts', """
              select r.status, count(*)
              from broadcast_recipients r
              join broadcasts b on b.id = r.broadcast_id
              where b.template_key = 'after_webinar'
              group by 1""")
          EOF
