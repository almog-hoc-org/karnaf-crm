name: Ops diagnostic (read-only)

# Manually-dispatched production health report for the round after the
# 2026-09 database incident. Every query is read-only except one, which
# only runs when the `finish_drain` input is set: unscheduling the one-off
# cron-history drain job once it has nothing left to delete.
on:
  workflow_dispatch:
    inputs:
      finish_drain:
        description: 'Unschedule karnaf_drain_cron_history_once (only when the report shows the drain is done)'
        type: boolean
        default: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Post-restart health report
        env:
          SUPABASE_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
          PROJECT_REF: svkzkpgccahwmyflobvn
          OWNER_EMAIL: karnaf.yazamut@gmail.com
          FINISH_DRAIN: ${{ inputs.finish_drain }}
        run: |
          python3 - <<'EOF'
          import json, os, time, urllib.error, urllib.request

          token = os.environ['SUPABASE_TOKEN']
          ref = os.environ['PROJECT_REF']
          email = os.environ['OWNER_EMAIL'].lower()
          finish_drain = os.environ.get('FINISH_DRAIN', 'false') == 'true'

          def q(label, sql, proves='', attempts=6):
              print(f'== {label} ==')
              if proves:
                  print(f'-- proves: {proves}')
              for i in range(attempts):
                  req = urllib.request.Request(
                      f'https://api.supabase.com/v1/projects/{ref}/database/query',
                      data=json.dumps({'query': sql}).encode(),
                      headers={'Authorization': f'Bearer {token}',
                               'Content-Type': 'application/json',
                               'User-Agent': 'karnaf-ops/1.0'}, method='POST')
                  try:
                      with urllib.request.urlopen(req, timeout=60) as r:
                          rows = json.loads(r.read().decode())
                      print(json.dumps(rows, ensure_ascii=False, indent=1, default=str))
                      print()
                      return rows
                  except Exception as e:
                      body = ''
                      try:
                          body = e.read().decode(errors='replace')[:200]
                      except Exception:
                          pass
                      print(f'-- attempt {i + 1}/{attempts}: {e} {body}')
                      if i < attempts - 1:
                          time.sleep(6 * (i + 1))
              print('GAVE UP\n')
              return None

          # ── 1. Alive? ────────────────────────────────────────────────
          q('database liveness', 'select now() as db_time, version() as pg',
            'if this fails nothing below matters')

          q('heartbeats', """
              select name, last_ok_at, now() - last_ok_at as age,
                     (metadata->>'degraded') as degraded
              from system_heartbeats order by name""",
            'ages in minutes = scheduler + pg_net + edge functions all working')

          # ── 2. The dry-run report the restored time engine produces ──
          q('dry-run report (automation_tick heartbeat)', """
              select last_ok_at,
                     metadata->'timeRules' as time_rules,
                     metadata->'investor' as investor,
                     metadata->'errors' as errors,
                     metadata->'capBreaches' as cap_breaches
              from system_heartbeats where name = 'automation_tick'""",
            'matches per rule + sample lead ids; nothing was sent (dryRun=true)')

          q('time rules on the books', """
              select code, name_he, trigger_event, enabled
              from automation_rules
              where trigger_event in ('time.elapsed', 'deal.investor_open')
              order by enabled desc, code""",
            'which rules the report is about')

          # ── 3. Cron and the history drain ────────────────────────────
          q('cron jobs', """
              select jobid, jobname, schedule, active from cron.job order by jobid""",
            'karnaf_drain_cron_history_once present = drain still scheduled; karnaf_purge_cron_history present = migration 125 applied')

          q('cron history size (estimate, no scan)', """
              select reltuples::bigint as est_rows,
                     pg_size_pretty(pg_total_relation_size('cron.job_run_details')) as total_size
              from pg_class where oid = 'cron.job_run_details'::regclass""",
            'was tens of millions on 09-06; drain done when this is a few thousand')

          q('drain job recent runs', """
              select d.status, d.start_time, d.end_time,
                     left(d.return_message, 120) as message
              from cron.job_run_details d
              join cron.job j on j.jobid = d.jobid
              where j.jobname = 'karnaf_drain_cron_history_once'
              order by d.start_time desc limit 5""",
            'each run deletes up to 20k rows; "DELETE 0" = nothing left', attempts=2)

          q('pg_net queue depth', 'select count(*) as queued from net.http_request_queue',
            'was 13 stuck on 09-06; should be 0-2 now')

          # ── 4. Intake: are leads reaching us? ────────────────────────
          q('newest inbound message', """
              select max(created_at) as last_inbound,
                     now() - max(created_at) as silence
              from messages where direction = 'inbound'""",
            'silence in hours during the day = webhook still not delivering')

          q('webhook_inbox newest 5', """
              select received_at, source, processed_status,
                     left(coalesce(error_message, ''), 100) as error
              from webhook_inbox order by received_at desc limit 5""",
            'rows here = Meta is calling the webhook at all')

          # The digest is the only thing that would have said "no inbound for
          # 3 days". Did its cron fire, and what did the gateway answer?
          q('operator digest cron runs (newest 5)', """
              select d.status, d.start_time, left(d.return_message, 120) as message
              from cron.job_run_details d
              join cron.job j on j.jobid = d.jobid
              where j.jobname = 'karnaf_operator_digest'
              order by d.start_time desc limit 5""",
            'succeeded = net.http_post was queued; the HTTP answer is below', attempts=2)

          q('edge-function answers seen by pg_net (last 6h)', """
              select created, status_code, left(content::text, 160) as body
              from net._http_response
              where content::text like '%%nothing_new%%'
                 or content::text like '%%silenceAlerted%%'
                 or content::text like '%%Unauthorized%%'
                 or content::text like '%%Invalid JWT%%'
                 or status_code >= 400
              order by created desc limit 8""",
            '401/Invalid JWT on the digest = gateway verify_jwt rejected the worker bearer')

          q('intake alerts', """
              select kind, delivered, created_at, left(title, 80) as title
              from operator_alerts
              where kind in ('intake_silence', 'inbound_window_opened', 'human_inbound')
              order by created_at desc limit 5""",
            'intake_silence rows = the watchdog noticed; inbound rows = a lead wrote')

          q('lead sources — where do leads actually come from', """
              select source,
                     count(*) as leads,
                     count(*) filter (where consent_email is true) as consent_true,
                     count(*) filter (where consent_email is false) as consent_false,
                     count(*) filter (where consent_email is null) as consent_null,
                     count(*) filter (where email is not null) as with_email,
                     count(*) filter (where landing_page is not null or utm_source is not null) as with_attribution
              from leads
              group by source order by leads desc""",
            'the migration matched only source=landing_page; this shows which other sources are really landing pages')

          q('source_detail top 20', """
              select source, source_detail, count(*) as leads
              from leads
              group by source, source_detail
              order by leads desc limit 20""",
            'slugs / form names that identify landing pages inside other sources')

          q('landing_pages registry', """
              select slug, campaign, source, active from landing_pages order by slug""",
            'the in-system landing pages')

          q('email consent coverage (form-source leads)', """
              select source, coalesce(consent_email::text, 'null') as consent_email, count(*) as leads
              from leads
              where public.is_form_source(source)
              group by 1, 2 order by 1, 2""",
            'after migration 127: null should be 0 for every form source; false = explicit refusals, left alone')

          q('consent_granted events', """
              select (event_payload->>'backfill')::boolean as backfill, count(*)
              from lead_events where event_type = 'consent_granted'
              group by 1 order by 1""",
            'backfill=true rows = migration 126; backfill=false = trigger on new leads')

          q('opt-outs (last 30 days) by basis', """
              select event_payload->>'basis' as basis, event_payload->>'channel' as channel, count(*)
              from lead_events
              where event_type = 'consent_revoked' and created_at > now() - interval '30 days'
              group by 1, 2 order by 3 desc""",
            'inbound_keyword = the lead wrote הסר; provider_unsubscribe = Rav Messer link; manual = operator')

          q('marketing templates without an opt-out route', """
              select key, status, metadata->'meta'->>'category' as category,
                     metadata->'meta'->>'footer' as footer,
                     metadata->'meta'->>'has_opt_out' as has_opt_out
              from message_templates
              where channel = 'whatsapp'
                and metadata->'meta'->>'category' = 'MARKETING'
              order by key""",
            'has_opt_out=false after the next template sync = resubmit that template to Meta with a footer', attempts=2)

          # ── 4b. Broadcast (email campaign) diagnosis ─────────────────
          q('email channel config', """
              select config_value->>'provider' as provider,
                     config_value->>'fromName'  as from_name,
                     coalesce(nullif(config_value->>'fromEmail', ''), '(not set)') as from_email,
                     coalesce(nullif(config_value->>'replyTo', ''), '(not set)')  as reply_to,
                     config_value->>'requireConsent' as require_consent,
                     updated_at
              from crm_config where config_key = 'email_channel'""",
            'provider=resend needs a from_email on a domain verified at resend.com/domains; '
            'a gmail from_email blocks scheduling on purpose')

          q('broadcasts newest 5', """
              select id, name, channel, status, scheduled_at, recipients_count,
                     sent_count, failed_count, skipped_count, provider_ref,
                     created_at, updated_at
              from broadcasts order by created_at desc limit 5""",
            'the 311-recipient email campaign: status + provider_ref (listId/messageId) tell how far it got')

          q('broadcast recipients by status (newest broadcast)', """
              select r.status, r.error, r.provider_ref->>'provider' as provider, count(*)
              from broadcast_recipients r
              join broadcasts b on b.id = r.broadcast_id
              where b.id = (select id from broadcasts order by created_at desc limit 1)
              group by 1, 2, 3 order by 4 desc""",
            'pending = not sent yet; sent rows on the Resend path carry provider_ref.id '
            '(the Resend message id); skipped/failed carry a reason')

          q('broadcast failure alerts', """
              select created_at, delivered, title, body
              from operator_alerts
              where kind in ('broadcast_email_failed', 'broadcast_email_stalled', 'broadcast_failed')
              order by created_at desc limit 5""",
            'broadcast_email_failed = campaign dead; broadcast_email_stalled = Resend rate limit '
            'or outage, sending resumes by itself')

          q('email unsubscribes via the link (last 30d)', """
              select date_trunc('day', created_at)::date as day, count(*)
              from lead_events
              where event_type = 'consent_revoked'
                and event_payload->>'basis' = 'provider_unsubscribe'
                and created_at > now() - interval '30 days'
              group by 1 order by 1 desc""",
            'clicks on the unsubscribe footer link (email-unsubscribe function)')

          q('broadcast dispatch cron + gateway (last 6h)', """
              select created, status_code, left(content::text, 200) as body
              from net._http_response
              where content::text like '%%broadcast%%' or content::text like '%%enqueued%%'
              order by created desc limit 5""",
            'is the every-minute broadcast-dispatch call answered 200', attempts=2)

          # ── 5. Alert channels ────────────────────────────────────────
          q('alert ledger (newest 5)', """
              select kind, delivered, channel_results, created_at
              from operator_alerts order by created_at desc limit 5""",
            'email.skipped=no_alert_email_from until ALERT_EMAIL_FROM is added')

          # ── 6. Loose ends ────────────────────────────────────────────
          q('auth audit log sanity', """
              select count(*) as rows_7d,
                     max(created_at) as newest
              from auth.audit_log_entries
              where created_at > now() - interval '7 days'""",
            'zero here means Supabase is not writing audit rows at all (then the empty owner lookup is explained)')

          q('auth audit newest 3', """
              select created_at, payload->>'action' as action,
                     payload->>'actor_username' as who
              from auth.audit_log_entries
              order by created_at desc limit 3""",
            'what an audit row looks like on this instance', attempts=2)

          q('event tables after the flood cleanup', """
              select schemaname, relname, n_live_tup, n_dead_tup
              from pg_stat_user_tables
              where relname in ('lead_events', 'activities', 'messages', 'operator_alerts')
              order by schemaname, relname""",
            'lead_events should stay a few thousand; dead tuples shrink after autovacuum')

          # ── 7. The one write, opt-in ─────────────────────────────────
          if finish_drain:
              q('unschedule the finished drain job', """
                  select cron.unschedule('karnaf_drain_cron_history_once') as unscheduled
                  where exists (select 1 from cron.job where jobname = 'karnaf_drain_cron_history_once')""",
                'after this, Deploy Supabase can apply migration 125 (index + nightly purge)')
          else:
              print('== finish_drain not set; no writes performed ==')
          EOF
