name: Ops diagnostic (read-only)

# Manually-dispatched production diagnostic. This revision answers one
# question first — why can't the owner sign in — and then reports whether
# the database and its workers are back. The only write is repairing the
# owner's own profile row (role/is_active), which is the fix if that is
# what is wrong.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Why can't the owner sign in
        env:
          SUPABASE_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
          PROJECT_REF: svkzkpgccahwmyflobvn
          OWNER_EMAIL: karnaf.yazamut@gmail.com
        run: |
          python3 - <<'EOF'
          import json, os, time, urllib.error, urllib.request

          token = os.environ['SUPABASE_TOKEN']
          ref = os.environ['PROJECT_REF']
          email = os.environ['OWNER_EMAIL'].lower()

          def q(label, sql, proves='', attempts=6):
              print(f'== {label} ==')
              if proves:
                  print(f'-- proves: {proves}')
              for i in range(attempts):
                  req = urllib.request.Request(
                      f'https://api.supabase.com/v1/projects/{ref}/database/query',
                      data=json.dumps({'query': sql}).encode(),
                      headers={'Authorization': f'Bearer {token}',
                               'Content-Type': 'application/json',
                               'User-Agent': 'karnaf-ops/1.0'}, method='POST')
                  try:
                      with urllib.request.urlopen(req, timeout=60) as r:
                          rows = json.loads(r.read().decode())
                      print(json.dumps(rows, ensure_ascii=False, indent=1, default=str))
                      print()
                      return rows
                  except Exception as e:
                      body = ''
                      try:
                          body = e.read().decode(errors='replace')[:200]
                      except Exception:
                          pass
                      print(f'-- attempt {i + 1}/{attempts}: {e} {body}')
                      if i < attempts - 1:
                          time.sleep(6 * (i + 1))
              print('GAVE UP\n')
              return None

          # 1. Is the database answering at all? Sign-in needs it: GoTrue
          #    reads auth.users, the app then reads profiles for the role.
          alive = q('database liveness', 'select now() as db_time, version() as pg',
                    'if this fails, nobody can sign in — the auth service uses this database')

          # 2. The auth account itself.
          q('auth account', f"""
              select id, email, email_confirmed_at, banned_until, deleted_at,
                     last_sign_in_at, created_at,
                     (raw_app_meta_data->>'provider') as provider
              from auth.users where lower(email) = '{email}'""",
            'no row = never signed up; banned_until/deleted_at set = blocked; email_confirmed_at null = must confirm')

          # 3. The profile the app gates on. ProtectedRoute bounces to /login
          #    when role is null or is_active is false — that reads as
          #    "can't log in" even though the password was accepted.
          q('profile row', f"""
              select p.id, p.email, p.role, p.is_active, p.updated_at
              from public.profiles p
              where lower(p.email) = '{email}'
                 or p.id in (select id from auth.users where lower(email) = '{email}')""",
            "role must be owner/admin and is_active true, or the app treats the login as failed")

          q('who is an active owner/admin today', """
              select email, role, is_active from public.profiles
              where role in ('owner','admin') order by role, email""",
            'context: is there any working admin account')

          # 4. What the auth service actually recorded for this account —
          #    a `login` row is a password accepted; `token_refreshed` is an
          #    open tab renewing itself. Tells whether last_sign_in_at above
          #    was the owner at the keyboard or a background refresh.
          q('auth audit trail (newest 15)', f"""
              select created_at,
                     payload->>'action' as action,
                     payload->>'error' as error,
                     ip_address
              from auth.audit_log_entries
              where lower(payload->>'actor_username') = '{email}'
                 or payload->>'actor_id' in (select id::text from auth.users where lower(email) = '{email}')
              order by created_at desc limit 15""",
            'login = password accepted; token_refreshed = an open tab; nothing recent = the owner never reached the auth service')

          # 5. While we are here: did the workers come back?
          q('heartbeats', """
              select name, last_ok_at, now() - last_ok_at as age
              from system_heartbeats order by name""",
            'ages in minutes = restart worked; ages in hours = still frozen')

          q('alert ledger (newest 3)', """
              select kind, delivered, channel_results, created_at
              from operator_alerts order by created_at desc limit 3""",
            'per-channel result tells whether the secrets are in place')
          EOF
