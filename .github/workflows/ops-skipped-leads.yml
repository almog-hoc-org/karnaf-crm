# TEMPORARY read-only diagnostic — broadcast + Meta-template health
# snapshot: sync state per template, recent broadcasts and their
# failure/skip breakdown. Dispatch manually when something looks off.
name: Ops - Skipped Leads

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Broadcast + template health snapshot
        env:
          SUPABASE_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
          PROJECT_REF: svkzkpgccahwmyflobvn
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request

          token = os.environ['SUPABASE_TOKEN']
          ref = os.environ['PROJECT_REF']

          def q(label, sql):
              req = urllib.request.Request(
                  f'https://api.supabase.com/v1/projects/{ref}/database/query',
                  data=json.dumps({'query': sql}).encode(),
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Content-Type': 'application/json',
                      'User-Agent': 'karnaf-ops/1.0',
                  }, method='POST')
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      rows = json.loads(r.read().decode())
              except Exception as e:
                  print(f'== {label} ==\nERROR: {e}\n')
                  return
              print(f'== {label} ==')
              print(json.dumps(rows, ensure_ascii=False, indent=1, default=str))
              print()

          q('whatsapp templates - meta sync state', """
              select key, status,
                     metadata->'meta'->>'status' as meta_status,
                     metadata->'meta'->>'language' as meta_lang,
                     metadata->'meta'->>'synced_at' as synced_at
              from message_templates where channel = 'whatsapp'
              order by (metadata->'meta'->>'status') nulls last, key""")
          q('last 5 broadcasts', """
              select left(id::text, 8) as id, name, channel, template_key,
                     meta_template, status, recipients_count, sent_count,
                     failed_count, skipped_count, scheduled_at
              from broadcasts order by created_at desc limit 5""")
          q('recipient error breakdown (last 7 days)', """
              select left(r.broadcast_id::text, 8) as broadcast, r.status,
                     left(coalesce(r.error, ''), 250) as error, count(*)
              from broadcast_recipients r
              where r.broadcast_id in (
                select id from broadcasts where created_at > now() - interval '7 days')
              group by 1, 2, 3 order by 1, 4 desc limit 30""")
          q('dlq dispatches last 7 days grouped', """
              select left(coalesce(last_error, ''), 250) as err, count(*)
              from outbound_dispatch
              where status = 'dlq' and created_at > now() - interval '7 days'
              group by 1 order by 2 desc limit 10""")
          EOF
