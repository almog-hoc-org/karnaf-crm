name: Ops diagnostic (read-only)

# Temporary, manually-dispatched production diagnostic. Read-only.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Meta whether it is still delivering to us
        env:
          SUPABASE_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
          PROJECT_REF: svkzkpgccahwmyflobvn
        run: |
          python3 - <<'EOF'
          import json, os, time, urllib.error, urllib.request

          token = os.environ['SUPABASE_TOKEN']
          ref = os.environ['PROJECT_REF']

          def q(label, sql, proves='', attempts=5):
              print(f'== {label} ==')
              if proves:
                  print(f'-- proves: {proves}')
              for i in range(attempts):
                  req = urllib.request.Request(
                      f'https://api.supabase.com/v1/projects/{ref}/database/query',
                      data=json.dumps({'query': sql}).encode(),
                      headers={'Authorization': f'Bearer {token}',
                               'Content-Type': 'application/json',
                               'User-Agent': 'karnaf-ops/1.0'}, method='POST')
                  try:
                      with urllib.request.urlopen(req, timeout=90) as r:
                          rows = json.loads(r.read().decode())
                      print(json.dumps(rows, ensure_ascii=False, indent=1, default=str))
                      print()
                      return rows
                  except Exception as e:
                      body = ''
                      try:
                          body = e.read().decode(errors='replace')[:200]
                      except Exception:
                          pass
                      print(f'-- attempt {i + 1}/{attempts}: {e} {body}')
                      if i < attempts - 1:
                          time.sleep(8 * (i + 1))
              print('GAVE UP\n')
              return None

          # The decisive question. Calls the deployed meta-template-status
          # function server-side with the WhatsApp token already in the
          # secrets; no credential is echoed back, only Meta's verdict.
          q('Meta subscription + phone number state', """
              select net.http_post(
                url := 'https://svkzkpgccahwmyflobvn.supabase.co/functions/v1/meta-template-status',
                headers := jsonb_build_object('Content-Type','application/json'),
                body := jsonb_build_object('action','subscription')
              ) as request_id""",
            'kicks off the async call; the response lands in net._http_response')

          print('waiting 20s for the async HTTP response to land...')
          time.sleep(20)

          q('the Meta answer', """
              select status_code, left(content, 1500) as content, created
              from net._http_response
              order by created desc limit 3""",
            'subscribed_apps.data empty => the app is no longer subscribed to the WABA')

          q('cron run history, last 6h', """
              select j.jobname, d.status, count(*) as runs, max(d.start_time) as last_run,
                     left(max(d.return_message), 200) as sample
              from cron.job_run_details d join cron.job j on j.jobid = d.jobid
              where d.start_time > now() - interval '6 hours'
              group by 1,2 order by 1,2""",
            'which workers actually fire')

          q('flood cleanup result', """
              select event_type, count(*) as rows
              from lead_events
              where event_type in ('sla_breach','state_transition_rejected','manual_return_to_ai')
              group by 1 order by 2 desc""",
            'migration 123 should have cut these to at most 5 per lead')

          q('activities for the reported lead', """
              select activity_type, count(*) as rows
              from activities
              where contact_id = '3a4ead6c-a1a7-438b-96c3-b107fd30668f'
              group by 1 order by 2 desc""",
            'the chat should now fit inside the 400-row window')
          EOF
