# TEMPORARY ops task — set the corrected WhatsApp Business Account id
# (supplied by the operator from Meta WhatsApp Manager), fire the template
# sync, and verify templates now carry live Meta status. Remove afterwards.
name: Ops - Skipped Leads

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Fix WABA id and verify template sync
        env:
          SUPABASE_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
          PROJECT_REF: svkzkpgccahwmyflobvn
        run: |
          python3 - <<'EOF'
          import json, os, time, urllib.request

          token = os.environ['SUPABASE_TOKEN']
          ref = os.environ['PROJECT_REF']

          def q(label, sql):
              req = urllib.request.Request(
                  f'https://api.supabase.com/v1/projects/{ref}/database/query',
                  data=json.dumps({'query': sql}).encode(),
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Content-Type': 'application/json',
                      'User-Agent': 'karnaf-ops/1.0',
                  }, method='POST')
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      rows = json.loads(r.read().decode())
              except Exception as e:
                  print(f'== {label} ==\nERROR: {e}\n')
                  return
              print(f'== {label} ==')
              print(json.dumps(rows, ensure_ascii=False, indent=1, default=str))
              print()

          q('set corrected waba id', """
              update crm_config
              set config_value = '"1481486296955334"'::jsonb, updated_at = now()
              where config_key = 'whatsapp_waba_id'
              returning config_key, config_value, updated_at""")
          q('fire template sync', 'select public.run_template_sync()')
          time.sleep(15)
          q('sync response', """
              select status_code, left(content, 1500) as content, created
              from net._http_response
              where content like '%stage%'
              order by created desc limit 1""")
          q('templates meta state post-sync', """
              select key, status,
                     metadata->'meta'->>'status' as meta_status,
                     metadata->'meta'->>'language' as meta_lang,
                     metadata->'meta'->>'synced_at' as synced_at
              from message_templates where channel = 'whatsapp'
              order by (metadata->'meta'->>'status') nulls last, key""")
          q('after_webinar full meta', """
              select key, status, metadata->'meta' as meta
              from message_templates where key = 'after_webinar'""")
          EOF
